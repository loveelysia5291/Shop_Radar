name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Prepare Release Keystore
        id: keystore
        env:
          KS1: ${{ secrets.KEYSTORE_BASE64 }}
          KS2: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          KS_BASE64="${KS1:-$KS2}"
          if [ -n "$KS_BASE64" ]; then
            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$KS_BASE64" | base64 -d > "$KS"
            echo "keystore_path=$KS" >> "$GITHUB_OUTPUT"
            echo "Release keystore prepared at $KS"
          else
            echo "::warning::No keystore secret found (KEYSTORE_BASE64 or RELEASE_KEYSTORE_BASE64 is empty)."
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          P1: ${{ secrets.KEYSTORE_PASSWORD }}
          P2: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          A1: ${{ secrets.KEY_ALIAS }}
          A2: ${{ secrets.RELEASE_KEY_ALIAS }}
          K1: ${{ secrets.KEY_PASSWORD }}
          K2: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PASSWORD="${P1:-$P2}"
          export RELEASE_KEY_ALIAS="${A1:-${A2:-key0}}"
          export RELEASE_KEY_PASSWORD="${K1:-$K2}"
          gradle :app:assembleRelease --stacktrace

      - name: Verify Release APK Signature
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APP=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "== Verifying signature for $APP with $BT/apksigner =="
            "$BT/apksigner" verify --print-certs -v "$APP"
          else
            echo "::warning::No release APK found in app/build/outputs/apk/release/"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopRadar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopRadar-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
