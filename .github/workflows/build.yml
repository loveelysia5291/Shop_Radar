name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'key0' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Prepare Release Keystore
        id: keystore
        if: ${{ (secrets.KEYSTORE_BASE64 != '') || (secrets.RELEASE_KEYSTORE_BASE64 != '') }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "keystore_path=$KS" >> "$GITHUB_OUTPUT"
          echo "Release keystore prepared at $KS"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify Release APK Signature
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APP=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "== Verifying signature for $APP with $BT/apksigner =="
            "$BT/apksigner" verify --print-certs "$APP" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          else
            echo "::warning::No release APK found in app/build/outputs/apk/release/"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopRadar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopRadar-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
